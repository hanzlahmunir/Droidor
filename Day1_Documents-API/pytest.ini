[pytest]
# Run from the project root so `alembic.ini`, the `app` package, and the
# `alembic` package are all importable/findable.
testpaths = tests
# Put the project root on sys.path so `import app` / `import alembic` work
# regardless of where pytest is invoked from. Without this, CI fails with
# "No module named 'app'" because the rootdir isn't auto-added to sys.path.
pythonpath = .
# Show a short summary of failures and print the reason for skips.
addopts = -ra
