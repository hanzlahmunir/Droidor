name: Day4 RAG

on:
  push:
    paths:
      - "Day4_RAG/**"
      # Day 4's compose builds the Day 1 API from source and reads its
      # /documents endpoint, so a change there can break this. Watch it.
      - "Day1_Documents-API/**"
      - ".github/workflows/day4-rag.yml"
  pull_request:
    paths:
      - "Day4_RAG/**"
      - "Day1_Documents-API/**"
      - ".github/workflows/day4-rag.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Day4_RAG

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12, matching the container. The host runs 3.14, which is too new
          # for some of these wheels.
          python-version: "3.12"

      - name: Install dependencies
        # CPU-only torch, from PyTorch's own index. The default resolver pulls
        # the CUDA build -- ~2.5GB of NVIDIA libraries that a GitHub runner
        # cannot use and that turn a two-minute job into a ten-minute one.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements.txt

      - name: Run tests
        # The whole suite is offline: no network, no database, no API key, no
        # model download. That is deliberate and it is what makes the suite
        # worth running -- a test that called Groq would go red whenever the
        # API had a bad afternoon, and would cost money per push.
        #
        # Retrieval logic is exercised against a REAL Chroma collection in a
        # temp directory, using FakeEmbedder for the vectors. Chroma is the
        # dependency whose behaviour we rely on; mocking it would test the
        # mock. The embeddings are faked because their semantics are measured
        # by `rag eval` against the real corpus, not asserted in unit tests.
        #
        # GROQ_API_KEY is deliberately NOT set here. If any test needs it, the
        # suite is not offline and this job should fail.
        run: python -m pytest -v

      - name: Check the evaluation set stays valid
        # The floor in config.py is justified by data/eval_questions.json.
        # If that file loses its unanswerable questions, the justification
        # silently becomes meaningless -- a floor of -1 would then score
        # perfectly. This is cheap insurance on the project's main claim.
        run: python -m pytest tests/test_evaluate.py -v

      - name: Check no secrets are committed
        # Same guard as Days 1-3. This repo has already leaked a key once,
        # from a real value pasted into a committed file. Day 4 adds a Groq
        # key to .env (gitignored), so the guard matters more here, not less.
        run: |
          if grep -rEq "gsk_[A-Za-z0-9]{30,}|tvly-dev-[A-Za-z0-9]{10,}" \
              --include="*.py" --include="*.example" --include="*.md" \
              --include="*.json" --include="*.yml" .; then
            echo "::error::A real API key appears to be committed."
            exit 1
          fi
          echo "No secrets found."

  docker-build:
    # `docker compose up` is the documented entry point, so a broken
    # Dockerfile must fail CI even when the tests pass. Adopted from
    # m-hamzaj/Cli-chat during Day 2's peer review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the RAG image
        working-directory: Day4_RAG
        # This also verifies the embedding model downloads and loads at build
        # time. If it did not, the failure would otherwise appear at the first
        # `ask` -- slowly, as a network timeout rather than a build error.
        run: docker build -t day4-rag .

      - name: Build the Day 1 API image
        # Day 4's compose builds this from source rather than copying it, so
        # the coupling is real and worth verifying here.
        working-directory: Day1_Documents-API
        run: docker build -t day1-documents-api .

      - name: Validate the compose file
        working-directory: Day4_RAG
        # `config` parses and resolves the whole file, catching a bad service
        # reference or an unresolvable interpolation without starting anything.
        #
        # NOTE: this does NOT catch the missing external volume
        # (day3_crawler_pgdata), which only exists on a machine where Day 3
        # has run. That is by design -- see the note in docker-compose.yml --
        # and it is why this job validates and builds but does not `up`.
        run: docker compose config --quiet && echo "compose file is valid"
